<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Ninho</title>
  <meta name="description" content="Diário do bebê: peso, fotos e marcos do desenvolvimento." />
  <meta name="theme-color" content="#F6EFE4" />
  <!-- iPhone: abre em tela cheia quando adicionado à Tela de Início -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ninho" />
  <link rel="apple-touch-icon" href="img/icone-180.png" />
  <link rel="icon" type="image/png" href="img/icone-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/fontes.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main id="tela" class="tela"></main>

  <nav class="abas" id="abas">
    <button data-aba="inicio" class="aba"><img src="img/ui/inicio.png" alt="" /><span>Início</span></button>
    <button data-aba="peso" class="aba"><img src="img/ui/peso.png" alt="" /><span>Peso</span></button>
    <button id="mais" class="aba-mais" aria-label="Adicionar"><img src="img/ui/mais.png" alt="" /></button>
    <button data-aba="momentos" class="aba"><img src="img/ui/momentos.png" alt="" /><span>Momentos</span></button>
    <button data-aba="marcos" class="aba"><img src="img/ui/marcos.png" alt="" /><span>Marcos</span></button>
  </nav>

  <div id="folha-fundo" class="folha-fundo"></div>
  <section id="folha" class="folha" role="dialog" aria-modal="true"></section>
  <div id="visor" class="visor"></div>
  <div id="aviso" class="aviso"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
